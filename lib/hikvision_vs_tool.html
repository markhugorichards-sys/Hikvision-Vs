<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikvision Vs. — Competitive Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1621; --ink2:#17222F; --panel:#1C2A3A; --line:#2C3B4E; --line2:#3A4C61;
  --red:#E4002B; --red-d:#B80022; --txt-soft:#6B7889;
  --send:#7C4DFF; --hw:#0091EA; --sw:#00BFA5; --sus:#00C853; --ai:#FF7A1A;
  --good:#4ADE80; --warn:#F0B44E;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--ink);color:#D8DEE6;line-height:1.55;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:50;background:var(--ink2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:13px 24px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.5px;color:#fff;white-space:nowrap}
.brand .hk{color:var(--red)}
.brand .vs{color:var(--txt-soft);font-weight:500;margin-left:8px;font-size:14px;letter-spacing:2px}
.tagline{font-size:11px;color:var(--txt-soft);letter-spacing:1px;text-transform:uppercase;border-left:1px solid var(--line2);padding-left:16px}
.save-status{font-size:10.5px;color:var(--sus);margin-left:14px;letter-spacing:.3px;white-space:nowrap;opacity:.85}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes radarGrow{from{transform:scale(0)}to{transform:scale(1)}}
.save-status.warn{color:var(--warn)}
.topbar .spacer{flex:1}
.btn{font-family:var(--body);font-weight:600;font-size:13px;border:none;border-radius:7px;padding:10px 15px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn-ghost{background:transparent;color:#AEB8C4;border:1px solid var(--line2)}
.btn-ghost:hover{border-color:var(--red);color:#fff}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-d)}
.btn-sm{padding:7px 11px;font-size:12px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 100px}
.cattabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:0}
.cattab{font-family:var(--disp);font-weight:600;font-size:15px;background:transparent;border:none;color:var(--txt-soft);
  padding:12px 22px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;transition:.15s}
.cattab:hover{color:#EAEFF4}
.cattab.on{color:#fff;border-bottom-color:var(--red)}
.deck{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:26px}
.deck h2{font-family:var(--disp);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--txt-soft);margin-bottom:16px;font-weight:600}
.row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--txt-soft);font-weight:600}
select,input[type=text],input[type=number],textarea{font-family:var(--body);font-size:14px;background:var(--ink);border:1px solid var(--line2);
  color:#EAEFF4;border-radius:8px;padding:10px 12px;min-width:210px}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--red)}
textarea{width:100%;min-height:64px;resize:vertical;font-family:var(--body);font-size:13.5px}
.pillars{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.pill{position:relative;cursor:pointer;user-select:none;border:1.5px solid var(--line2);border-radius:10px;padding:12px 15px;min-width:135px;background:var(--ink);transition:.15s}
.pill .pk{font-family:var(--disp);font-weight:600;font-size:14px;color:#EAEFF4;display:flex;align-items:center;gap:8px}
.pill .dot{width:10px;height:10px;border-radius:50%}
.pill .pd{font-size:10.5px;color:var(--txt-soft);margin-top:4px}
.pill[data-on="1"]{border-color:var(--accent);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.pill[data-on="1"]::after{content:"✓";position:absolute;top:9px;right:11px;color:var(--accent);font-weight:700;font-size:13px}
.pill[data-k=send]{--accent:var(--send)}.pill[data-k=hardware]{--accent:var(--hw)}
.pill[data-k=software]{--accent:var(--sw)}.pill[data-k=ai]{--accent:var(--ai)}
.pill[data-k=sustainability]{--accent:var(--sus)}.pill[data-k=all]{--accent:var(--red)}
/* verdict + radar */
.topgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-bottom:26px}
.verdict{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vcol{padding:24px 26px}
.vcol.hk{background:linear-gradient(135deg,#1a2634,#14202c)}
.vcol.cp{background:var(--ink2);border-left:1px solid var(--line)}
.vlabel{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--txt-soft);font-weight:600;margin-bottom:8px}
.vname{font-family:var(--disp);font-size:23px;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.15}
.vname.red{color:var(--red)}
.vmodel{font-size:11.5px;color:var(--txt-soft);font-family:var(--mono);margin-bottom:18px;min-height:16px}
.vscore{font-family:var(--disp);font-size:52px;font-weight:700;line-height:1;color:#fff}
.vscore .max{font-size:19px;color:var(--txt-soft);font-weight:400}
.vscore.win{color:var(--good)}
.vbar{height:8px;background:var(--ink);border-radius:5px;margin-top:14px;overflow:hidden}
.vbar span{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.vcol.hk .vbar span{background:linear-gradient(90deg,#22C55E,#4ADE80)}
.vcol.cp .vbar span{background:linear-gradient(90deg,var(--red-d),var(--red))}
.radarcard{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column}
.radarcard h3{font-family:var(--disp);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-soft);margin-bottom:6px;font-weight:600}
.radarleg{display:flex;gap:16px;font-size:11px;margin-top:6px;justify-content:center}
.radarleg span{display:flex;align-items:center;gap:6px;color:#AEB8C4}
.radarleg i{width:11px;height:3px;border-radius:2px;display:inline-block}
/* pillar blocks */
.pillar-block{margin-bottom:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--ink2)}
.pillar-head{display:flex;align-items:center;gap:14px;padding:15px 22px;border-bottom:1px solid var(--line)}
.pillar-head .bar{width:5px;height:32px;border-radius:3px}
.pillar-head h3{font-family:var(--disp);font-size:17px;font-weight:600;color:#fff;flex:1}
.pillar-head .wt{font-family:var(--mono);font-size:11.5px;color:var(--txt-soft)}
.pscore{font-family:var(--mono);font-size:13px;letter-spacing:2px}
.win-hk{color:var(--good);font-weight:600}.win-cp{color:#FF6B6B;font-weight:600}
.speclist{width:100%;border-collapse:collapse}
.speclist td{padding:10px 22px;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
.speclist tr:last-child td{border-bottom:none}
.speclist .k{color:var(--txt-soft);width:28%;font-weight:500}
.speclist .hk{color:#DCF3E4;width:36%}
.speclist .cp{color:#EAEFF4;width:36%}
.speclist .ns{color:#5A6675;font-style:italic}
.flag{display:inline-block;background:rgba(240,180,78,.14);color:var(--warn);font-size:11px;padding:2px 8px;border-radius:5px;margin-top:5px;font-weight:600}
.outcomes{padding:15px 22px;background:rgba(255,255,255,.02);border-top:1px solid var(--line)}
.outcomes h4{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-soft);margin-bottom:11px}
.ogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.ocard{background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:12px}
.ocard .who{font-family:var(--disp);font-weight:600;font-size:11.5px;color:var(--red);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.ocard .what{font-size:12px;color:#C3CCD6;line-height:1.5}
/* AI hero */
.aihero{border:1px solid var(--ai);border-radius:14px;overflow:hidden;margin-bottom:20px;background:linear-gradient(135deg,rgba(255,122,26,.06),transparent)}
.aihero .ah{display:flex;align-items:center;gap:14px;padding:15px 22px;border-bottom:1px solid rgba(255,122,26,.25)}
.aihero .ah .bar{width:5px;height:32px;border-radius:3px;background:var(--ai)}
.aihero .ah h3{font-family:var(--disp);font-size:17px;font-weight:600;color:#fff;flex:1}
.aihero .ah .tag{font-size:10.5px;color:var(--ai);border:1px solid var(--ai);border-radius:20px;padding:3px 10px;letter-spacing:.5px}
.aibody{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.aibox{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px}
.aibox .l{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--txt-soft);font-weight:600;margin-bottom:7px}
.aibox .t{font-size:13px;color:#DCE4EC;line-height:1.55}
.aiopen{grid-column:1/3;background:rgba(255,122,26,.05);border:1px dashed var(--ai);border-radius:10px;padding:14px}
.aiopen .l{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ai);font-weight:700;margin-bottom:8px}
.aiopen textarea{background:var(--ink);border-color:var(--line2)}
/* callouts */
.callout{border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;background:var(--ink2)}
.callout h3{font-family:var(--disp);font-size:16px;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.callout h3 .ic{width:6px;height:22px;border-radius:3px;background:var(--red)}
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.why-item{background:var(--ink);border:1px solid var(--line);border-left:3px solid var(--sw);border-radius:9px;padding:14px}
.why-item b{color:#EAEFF4;display:block;margin-bottom:4px;font-size:13.5px}
.why-item span{color:#AEB8C4;font-size:12.5px}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
.cert{background:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:12px 14px}
.cert.hk-only{border-left:3px solid var(--sus)}
.cert .ct{font-weight:600;font-size:13px;color:#EAEFF4}
.cert .cs{font-size:11.5px;color:var(--txt-soft);margin-top:3px}
/* power chart */
.chartcard{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}
.chartcard h3{font-family:var(--disp);font-size:16px;color:#fff;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.chartcard h3 .ic{width:6px;height:22px;border-radius:3px;background:var(--sus)}
.chartcard .sub{font-size:12.5px;color:var(--txt-soft);margin-bottom:16px}
/* calculator (surprise) */
.calc{border:1px solid var(--sus);border-radius:14px;overflow:hidden;margin-bottom:20px;background:linear-gradient(135deg,rgba(0,200,83,.05),transparent)}
.calc .ch{padding:16px 22px;border-bottom:1px solid rgba(0,200,83,.22);display:flex;align-items:center;gap:12px}
.calc .ch .bar{width:5px;height:30px;border-radius:3px;background:var(--sus)}
.calc .ch h3{font-family:var(--disp);font-size:17px;color:#fff;flex:1}
.calc .ch .tag{font-size:10.5px;color:var(--sus);border:1px solid var(--sus);border-radius:20px;padding:3px 10px}
.calcbody{padding:20px 22px}
.calcinputs{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;align-items:flex-end}
.calcinputs .field input{min-width:90px;width:110px}
.bignum{font-family:var(--disp);font-weight:700;font-size:46px;color:var(--good);line-height:1}
.bignum small{font-size:18px;color:var(--txt-soft);font-weight:400}
.calcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
.calcstat{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px}
.calcstat .cl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--txt-soft);font-weight:600;margin-bottom:8px}
.calcstat .cv{font-family:var(--disp);font-weight:700;font-size:26px;color:#EAEFF4}
.calcstat .cd{font-size:11.5px;color:var(--txt-soft);margin-top:4px}
.equiv{margin-top:18px;background:var(--ink);border-radius:10px;padding:16px;display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.equiv .eq{display:flex;align-items:center;gap:10px}
.equiv .eq .ei{font-size:26px}
.equiv .eq .et{font-size:12.5px;color:#C3CCD6}.equiv .eq .et b{color:#EAEFF4;font-size:15px;display:block}
.recycle-note{margin-top:16px;background:rgba(0,200,83,.08);border-left:3px solid var(--sus);border-radius:0 9px 9px 0;padding:13px 16px;font-size:13px;color:#CDEAD7}
.recycle-note a{color:var(--good)}
/* conclusion */
.conclusion{border:1px solid var(--line);border-radius:14px;padding:28px;margin-bottom:20px;background:linear-gradient(160deg,#1a2634,#141d28)}
.conclusion h2{font-family:var(--disp);font-size:22px;color:#fff;margin-bottom:6px}
.conclusion .lead{color:#AEB8C4;font-size:14px;margin-bottom:20px;max-width:640px}
.conc-item{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.conc-item:last-child{border:none}
.conc-item .who{font-family:var(--disp);font-weight:600;font-size:12px;color:var(--red);text-transform:uppercase;letter-spacing:.5px;min-width:150px;padding-top:2px}
.conc-item .txt{font-size:13.5px;color:#D8DEE6;flex:1}
.conc-close{margin-top:20px;font-family:var(--disp);font-size:16px;color:#fff;font-style:italic;line-height:1.5;border-left:3px solid var(--red);padding-left:16px}
.internal{border:1px dashed var(--warn);border-radius:12px;padding:16px 20px;margin-bottom:20px;background:rgba(240,180,78,.05)}
.internal .il{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--warn);font-weight:700;margin-bottom:8px}
.internal ul{list-style:none}.internal li{font-size:12.5px;color:#C3CCD6;padding:4px 0 4px 14px;position:relative}
.internal li:before{content:"⚑";position:absolute;left:0;color:var(--warn)}
/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(6,10,16,.85);z-index:100;overflow-y:auto;padding:36px 18px}
.modal-bg.open{display:block}
.modal{max-width:920px;margin:0 auto;background:var(--ink2);border:1px solid var(--line2);border-radius:16px;padding:28px}
.modal h2{font-family:var(--disp);font-size:22px;color:#fff;margin-bottom:6px}
.modal .sub{color:var(--txt-soft);font-size:13px;margin-bottom:20px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.mgrid .full{grid-column:1/3}
.mgrid label{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--txt-soft);margin-bottom:5px;font-weight:600}
.mgrid input,.mgrid select,.mgrid textarea{width:100%;min-width:0}
.msec{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);grid-column:1/3;margin-top:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:22px}
/* certificate editor */
#certEditor{grid-column:1/3}
.certrow{display:grid;grid-template-columns:1fr 1.35fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.certrow input[type=text]{min-width:0!important;width:100%}
.cchk{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sus);white-space:nowrap;text-transform:none;letter-spacing:0;margin:0;font-weight:600}
.cchk input{width:auto;min-width:0!important;accent-color:var(--sus)}
.cdel{background:transparent;border:1px solid var(--line2);color:#FF6B6B;border-radius:7px;padding:8px 11px;cursor:pointer;font-size:12px}
.cdel:hover{border-color:#FF6B6B}
.caddbtn{margin-top:2px}
#hikFeatureEditor{grid-column:1/3}
#hikFeatureEditor .featrow{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:#C3CCD6;text-transform:none;letter-spacing:0;font-weight:400;cursor:pointer;margin:0}
#hikFeatureEditor .featrow input{width:auto!important;min-width:0!important;margin-top:2px;accent-color:var(--sus)}
#hikFeatureEditor .featrow b{color:#EAEFF4}
#datasheetEditor{grid-column:1/3}
.dsheet-attached{display:flex;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--sus);border-radius:9px;padding:11px 14px;flex-wrap:wrap}
.dsheet-attached .name{font-size:12.5px;color:#EAEFF4;font-weight:600}
.dsheet-attached .meta{font-size:10.5px;color:var(--txt-soft)}
.dsheet-attached a{color:var(--sus);font-size:11.5px;text-decoration:none;font-weight:600}
.dsheet-attached a:hover{text-decoration:underline}
.dsheet-remove{background:transparent;border:1px solid var(--line2);color:#FF6B6B;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:11px;margin-left:auto}
.dsheet-empty{font-size:11.5px;color:var(--txt-soft);border:1px dashed var(--line2);border-radius:9px;padding:12px 14px}
.dsheet-empty input[type=file]{margin-top:8px;font-size:11.5px;color:#C3CCD6}
/* print */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important}
  .topbar,.deck,.topgrid,.pillar-block,.aihero,.callout,.chartcard,.calc,.conclusion,.internal,.modal-bg,#screenRoot{display:none!important}
  #printRoot{display:block!important}
}
@media(max-width:820px){.topgrid,.aibody,.ogrid,.calcgrid,.why-grid{grid-template-columns:1fr}.aiopen{grid-column:auto}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="logoClick()" style="cursor:pointer;user-select:none" title="Hikvision Vs.">
    <span class="hk">HIK</span>VISION<span class="vs">VS.</span></div>
  <div class="tagline" id="lblTagline">Competitive Intelligence · Internal</div>
  <span id="saveStatus" class="save-status"></span>
  <select id="langSel" onchange="setLang(this.value)" style="margin-left:12px;background:var(--ink);color:var(--txt-soft);border:1px solid var(--line2);border-radius:7px;font-size:11px;padding:4px 7px">
    <option value="en">EN</option><option value="de">DE</option><option value="es">ES</option>
  </select>
  <button onclick="toggleAdmin()" title="Show editing tools (add/edit/delete competitors and Hikvision models)"
    style="margin-left:8px;background:none;border:1px solid var(--line2);color:var(--txt-soft);border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:13px;opacity:.7">⚙</button>
  <div class="spacer"></div>
  <div id="adminTools" style="display:none;gap:10px;align-items:center">
    <button class="btn btn-ghost btn-sm" onclick="openAddHik()" id="btnAddHik">+ Hikvision model</button>
    <button class="btn btn-ghost btn-sm" onclick="openEditHik()" id="btnEditHik">Edit Hik model</button>
    <button class="btn btn-ghost btn-sm" onclick="openAdd()" id="btnAddComp">+ Add competitor</button>
    <button class="btn btn-ghost btn-sm" onclick="editCurrent()" id="btnEditComp">Edit competitor</button>
  </div>
  <button class="btn btn-red" onclick="generateBrochure()" id="btnGenerate">Generate for customer →</button>
</div>

<div id="screenRoot" class="wrap">
  <div class="cattabs" id="catTabs"></div>
  <div class="deck">
    <h2 id="lblBuildComparison">Build a comparison</h2>
    <div class="row">
      <div class="field"><label id="lblHikModel">Hikvision model</label><select id="hikSel" onchange="setHik(this.value)"></select></div>
      <div class="field"><label id="lblCompetitor">Competitor</label><select id="vendorSel" onchange="render()"></select></div>
      <div class="field" id="variantField"></div>
      <div class="field"><label id="lblQuantity">Quantity</label><input type="number" id="deckQty" min="0" step="1" value="30" oninput="setQty(this.value)" style="min-width:110px"></div>
      <div class="field"><label id="lblVertical">Vertical</label><select id="sectorSel" onchange="setSector(this.value)"></select></div>
      <div class="field"><label id="lblCustomer">Customer (optional)</label><input type="text" id="schoolName" placeholder="e.g. Bexley Grammar School" oninput="render()"></div>
    </div>

  const o=JSON.parse(JSON.stringify(base));

/* ---- LED technology visual: packaging cross-sections + real proportional pixel-pitch grids

function parsePitchMm(str){
  if(!str || typeof str!=='string') return null;

  return m ? parseFloat(m[1]) : null;
}
function classifyPackaging(str){
  if(!str) return null;
  const s = str.toUpperCase();
  if(/\bMIP\b/.test(s)) return 'MIP';
  if(/\bCOB\b/.test(s)) return 'COB';
  if(/\bHOB\b/.test(s) || /\bGOB\b/.test(s)) return 'HOB'; // same underlying tech, Hikvision's branded name vs the generic industry term
  if(/\bSMD\b/.test(s)) return 'SMD';
  return null;
}
function packagingCrossSectionSVG(type, on){
  // schematic cutaway: a PCB strip with LED packages, and (for HOB/MIP/COB) a protective resin layer
  const dotXs=[18,42,66,90,114];
  const boardY=54, dotY=boardY-8;
  const dotSize = type==='MIP' ? 7 : 10; // MIP's chips are genuinely smaller — no bracket, finer achievable pitch
  let resin='';
  if(type==='HOB' || type==='MIP'){
    resin = dotXs.map(x=>`<circle cx="${x+dotSize/2}" cy="${dotY+dotSize/2}" r="${type==='MIP'?9:11}" fill="rgba(74,222,128,.22)" stroke="#4ADE80" stroke-width="1.2"/>`).join('');
  } else if(type==='COB'){
    resin = `<rect x="8" y="${dotY-6}" width="${dotXs[dotXs.length-1]+dotSize+8-8}" height="${dotSize+12}" rx="9" fill="rgba(126,187,255,.18)" stroke="#7EBBFF" stroke-width="1.2"/>`;
  }
  const dots = dotXs.map(x=>`<rect x="${x}" y="${dotY}" width="${dotSize}" height="${dotSize}" rx="2" fill="${on?'#E4002B':'#5A6675'}"/>`).join('');
  return `<svg viewBox="0 0 132 66" width="100%" style="max-width:150px" xmlns="http://www.w3.org/2000/svg">
    <rect x="4" y="${boardY}" width="124" height="8" rx="2" fill="#1B2531"/>
    ${type==='COB' ? resin : ''}
    ${dots}
    ${(type==='HOB'||type==='MIP') ? resin : ''}
  </svg>`;
}
function pitchGridSVG(mm, label, cd){
  // dot spacing scaled to the real pitch value (clamped so both very fine and coarse pitches stay legible)
  const spacing = mm ? Math.max(7, Math.min(26, mm*9)) : 16;
  const n=5, dot=Math.max(2, spacing*0.22);
  let dots='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++) dots+=`<circle cx="${8+c*spacing}" cy="${8+r*spacing}" r="${dot}" fill="${cd}"/>`;
  const size = 8 + (n-1)*spacing + 8;
  return `<svg viewBox="0 0 ${size} ${size}" width="${Math.min(size,120)}" height="${Math.min(size,120)}" xmlns="http://www.w3.org/2000/svg" style="animation:radarGrow .5s cubic-bezier(.22,1,.36,1) both">${dots}</svg>`;
}
function ledTechVisual(HIKobj, Cobj, vendorName){

  const TYPES = [

  ];
  const cards = TYPES.map(([type,tag,desc])=>{

  return `<div class="ah"><div class="bar"></div><h3>LED Technology</h3><span class="tag">Packaging & pixel pitch, to scale</span></div>
    <div class="aibody" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">${cards}</div>

function radarSVG(cScores,size){
  const R=size*0.29,cx=size/2,cy=size/2+4;
  const axes=CATS[currentCat].axes;
  const pt=(ang,r)=>[cx+Math.cos(ang*Math.PI/180)*r, cy+Math.sin(ang*Math.PI/180)*r];
  let grid='';[1,2,3,4,5].forEach(v=>{const p=axes.map(a=>pt(a[2],R*v/5).join(',')).join(' ');grid+=`<polygon points="${p}" fill="none" stroke="#2C3B4E" stroke-width="1"/>`;});
  let spokes='',labels='';axes.forEach(a=>{const e=pt(a[2],R);spokes+=`<line x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}" stroke="#2C3B4E" stroke-width="1"/>`;
    const l=pt(a[2],R+15);
    /* keep label text-anchor edge-aware so long words (Hardware/Software) don't clip the viewBox at the horizontal axes */
    const anchor = Math.cos(a[2]*Math.PI/180) > 0.3 ? 'end' : Math.cos(a[2]*Math.PI/180) < -0.3 ? 'start' : 'middle';
    labels+=`<text x="${l[0]}" y="${l[1]}" fill="#8A95A3" font-size="9.5" font-family="DM Mono" text-anchor="${anchor}" dominant-baseline="middle">${a[0]}</text>`;});
  const poly=s=>axes.map(a=>pt(a[2],R*(s[a[1]]||0)/5).join(',')).join(' ');
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" xmlns="http://www.w3.org/2000/svg">${grid}${spokes}
    <polygon points="${poly(cScores)}" fill="rgba(228,0,43,.16)" stroke="#E4002B" stroke-width="2"
      style="transform-origin:${cx}px ${cy}px;animation:radarGrow .55s cubic-bezier(.22,1,.36,1) both"/>
    <polygon points="${poly(HIK.scores)}" fill="rgba(74,222,128,.16)" stroke="#4ADE80" stroke-width="2"
      style="transform-origin:${cx}px ${cy}px;animation:radarGrow .55s cubic-bezier(.22,1,.36,1) .18s both"/>${labels}</svg>`;
}

/* ---- power bar chart svg (uses category power keys) ---- */
function powerBars(rows){
  const vals=[];rows.forEach(([l,h,c])=>{if(h!=null)vals.push(h);if(c!=null)vals.push(c);});
  const anyCp=rows.some(([l,h,c])=>c!=null);
  if(!vals.length||!anyCp){
    return `<div style="color:var(--warn);font-size:13px;padding:10px 0">${currentVendor} doesn't publish an operating power figure${CATS[currentCat].sizeKeyed?` at ${hkSize()}-inch`:''} on this datasheet, so a running-cost comparison can't be modelled — which is itself worth asking them for.</div>`;}
  const maxW=Math.max(...vals)*1.15;const W=680,H=210,pad=42,gw=(W-pad*2)/rows.length;
  let bars='',axis='';
  [0,.25,.5,.75,1].forEach(f=>{const y=H-pad-(H-pad*1.4)*f;axis+=`<line x1="${pad}" y1="${y}" x2="${W-pad/2}" y2="${y}" stroke="#22303F" stroke-width="1"/><text x="${pad-8}" y="${y+4}" fill="#6B7889" font-size="10" font-family="DM Mono" text-anchor="end">${Math.round(maxW*f)}W</text>`;});
  rows.forEach(([label,hkv,cpv],i)=>{
    const gx=pad+gw*i+gw/2;const bw=34;const base=H-pad;const scale=(H-pad*1.4);
    if(hkv!=null){const h=scale*hkv/maxW;bars+=`<rect x="${gx-bw-4}" y="${base-h}" width="${bw}" height="${h}" rx="4" fill="url(#gh)"/><text x="${gx-bw/2-4}" y="${base-h-7}" fill="#4ADE80" font-size="12" font-weight="600" font-family="Space Grotesk" text-anchor="middle">${hkv}W</text>`;}
    if(cpv!=null){const h=scale*cpv/maxW;bars+=`<rect x="${gx+4}" y="${base-h}" width="${bw}" height="${h}" rx="4" fill="url(#gc)"/><text x="${gx+bw/2+4}" y="${base-h-7}" fill="#FF6B6B" font-size="12" font-weight="600" font-family="Space Grotesk" text-anchor="middle">${cpv}W</text>`;}
    bars+=`<text x="${gx}" y="${base+18}" fill="#8A95A3" font-size="11" font-family="Inter" text-anchor="middle">${label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4002B"/><stop offset="1" stop-color="#B80022"/></linearGradient></defs>
    ${axis}${bars}</svg>`;
}
function powerSVG(C){
  let rows;
  if(CATS[currentCat].sizeKeyed){rows=[[`${hkSize()}-inch`, hkWatts(), cpWatts(C)]];}
  else{rows=CATS[currentCat].powerKeys.map(([l,k])=>[l, HIK[k]!=null?HIK[k]:null, C[k]!=null?C[k]:null]);}
  return powerBars(rows);
}

/* ---- running-cost calculator — defaults to a 5-year comparison; selectable up to 7
   to line up with the Ultra Plus 7-year warranty when that's the more relevant figure ---- */
let calcState={qa:30,qb:10,tariff:0.25,years:5};
const HOURS=1520, GRID=0.131;
function ckeys(){return CATS[currentCat].calcKeys;}
function calcCompute(C){
  const {qa,tariff,years}=calcState;
  let hk=0, cp=0, anyCp=false;
  if(CATS[currentCat].sizeKeyed){
    const hv=hkWatts()||0, cv=cpWatts(C);
    hk = qa*hv*HOURS/1000;
    if(cv!=null){anyCp=true; cp = qa*cv*HOURS/1000;} else { cp = hk; }
  } else {
    ckeys().forEach(([lbl,key],i)=>{
      const q = i===0?qa:calcState.qb;
      const hv = HIK[key]!=null?HIK[key]:0;
      hk += q*hv*HOURS/1000;
      if(C[key]!=null){anyCp=true; cp += q*C[key]*HOURS/1000;}
      else { cp += q*hv*HOURS/1000; }
    });
  }
  if(!anyCp)return null;
  const gbp=(cp-hk)*tariff*years;const co2=(cp-hk)*years*GRID/1000;
  return {gbp:Math.max(0,gbp), co2:Math.max(0,co2), trees:Math.max(0,co2*1000/21.77), miles:Math.max(0,co2*1000/0.170)};
}
function setCalcYears(y){ calcState.years=+y; updateCalc(); autoSave(); }
function updateCalc(){
  const dq=document.getElementById('deckQty'); if(dq)calcState.qa=+dq.value||0;
  const tel=document.getElementById('ctar'); if(tel)calcState.tariff=+tel.value||0.25;
  const yel=document.getElementById('cyears'); if(yel)yel.value=calcState.years;
  const yrs=calcState.years;
  const r=calcCompute(store[currentVendor]);
  const el=document.getElementById('calcResult');
  if(!r){el.innerHTML=`<div style="color:var(--warn);font-size:13.5px">${currentVendor} publishes no operating power${CATS[currentCat].sizeKeyed?` at ${hkSize()}-inch`:''}, so we can't model the saving. Ask them for it — the absence is the story.</div>`;return;}
  el.innerHTML=`
    <div class="bignum" id="bn">£0<small> saved over ${yrs} years</small></div>
    <div class="calcgrid">
      <div class="calcstat"><div class="cl">Carbon avoided</div><div class="cv">${r.co2.toFixed(1)} t</div><div class="cd">CO₂e over ${yrs} years (DESNZ 2026 factor)</div></div>
      <div class="calcstat"><div class="cl">Equivalent to</div><div class="cv">${Math.round(r.trees).toLocaleString()}</div><div class="cd">trees working for a year</div></div>
      <div class="calcstat"><div class="cl">Or</div><div class="cv">${Math.round(r.miles).toLocaleString()}</div><div class="cd">car miles off the road</div></div>
    </div>`;
  // animate count-up
  const target=r.gbp;let t0=null;const bn=document.getElementById('bn');
  function step(ts){if(!t0)t0=ts;const p=Math.min((ts-t0)/900,1);const v=Math.round(target*p/10)*10;
    bn.innerHTML=`£${v.toLocaleString()}<small> saved over ${yrs} years vs ${currentVendor}</small>`;if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

function buildFormSchema(){
  const f=[["__section",t('identity')],["__name","Name","full"],["model","Model / part number"],["territory","Territory"]];
  const seen={};
  for(const k in PILLARS){
    f.push(["__section",PILLARS[k].name]);
    PILLARS[k].rows.forEach(([label,key])=>{ if(seen[key])return; seen[key]=1;
      if(CATS[currentCat].sizeKeyed && key==='power') return; // IFPD power handled by size+watts below
      const full=(label.length>16||['accessibility','processor','content','control','security','cms','eol','recycling'].includes(key));
      f.push([key,label,full?"full":null]);});
  }
  if(CATS[currentCat].hasAI){f.push(["__section","AI (open text)"],["ai","AI capability","full"]);}
  f.push(["__section",t('powerFigures')]);
  if(CATS[currentCat].sizeKeyed){
    if(editingHik){ f.push(["size","Size — inches (decides the comparison)"]); f.push(["watts","Watts at this part number (number)"]); }
    else { (CATS[currentCat].sizes||[65,75,86]).forEach(sz=>f.push(["pw"+sz, sz+"-inch watts (number)"])); }

  return f;
}

/* ================= PERSISTENCE (save/load) =================
   Autosaves to this browser's localStorage after every change, so a refresh
   mid-meeting doesn't lose work. Export/Import move a full backup between
   machines or let you keep dated snapshots (e.g. before a big meeting). */
const SAVE_KEY = "hikVsTool_state_v1";
let suppressAutosave = false; // true while restoring, so we don't save mid-load

function serializeState(){
  return {
    v:1, savedAt:new Date().toISOString(),
    currentCat, currentSector, bespoke, currentLang,
    actives, currentVariant, calcState, deletedKeys,
    currentHik, currentVendors, hikStores, stores,
    schoolName: (document.getElementById('schoolName')||{}).value || "",
    deckQty: (document.getElementById('deckQty')||{}).value || ""
  };
}
function mergeShippedDefaults(){
  /* Add anything new since the user's last save, and — where a specific data CORRECTION has
     shipped (marked with a bumped _v on the source entry) — overwrite that one entry even if the
     key already existed. Entries with no _v bump are left exactly as the user has them, so any of
     their own manual edits via "Edit competitor" / "Edit Hik model" survive untouched.
     Anything the user has explicitly deleted (e.g. gone EOL) is never revived. */
  ['ifpd','signage','led'].forEach(cat=>{
    if(!deletedKeys[cat]) deletedKeys[cat]={comp:[],hik:[]};
    if(!stores[cat]) stores[cat]={};
    for(const key in SHIPPED_STORES[cat]){
      if(deletedKeys[cat].comp.includes(key)) continue;
      const shipped=SHIPPED_STORES[cat][key], existing=stores[cat][key];
      if(!existing || (shipped._v||0) > (existing._v||0)) stores[cat][key]=JSON.parse(JSON.stringify(shipped));
    }
    if(!hikStores[cat]) hikStores[cat]={};
    for(const key in SHIPPED_HIK_STORES[cat]){
      if(deletedKeys[cat].hik.includes(key)) continue;
      const shipped=SHIPPED_HIK_STORES[cat][key], existing=hikStores[cat][key];
      if(!existing || (shipped._v||0) > (existing._v||0)) hikStores[cat][key]=JSON.parse(JSON.stringify(shipped));
    }
  });
}
function restoreState(d){
  if(!d || typeof d!=='object') throw new Error('Not a valid backup file');
  suppressAutosave = true;
  try{
    if(d.currentCat) currentCat = d.currentCat;
    if(d.currentSector) currentSector = d.currentSector;
    if(d.currentLang) currentLang = d.currentLang;
    if(typeof d.bespoke==='string') bespoke = d.bespoke;
    if(d.actives) actives = d.actives;
    if(d.currentVariant) currentVariant = d.currentVariant;
    if(d.calcState) calcState = d.calcState;
    if(d.currentHik) currentHik = d.currentHik;
    if(d.currentVendors) currentVendors = d.currentVendors;
    if(d.deletedKeys) deletedKeys = d.deletedKeys;
    if(d.hikStores) hikStores = d.hikStores;
    if(d.stores) stores = d.stores;
    /* merge in anything shipped since this snapshot was saved, without touching the user's own edits */
    mergeShippedDefaults();
    PILLARS = CATS[currentCat].PILLARS;
    store = stores[currentCat]; active = actives[currentCat]; currentVendor = currentVendors[currentCat];
    /* defensive: if a restored selection points at something that's since been deleted, fall back */
    if(!(currentVendor in store)){ currentVendor = Object.keys(store)[0]; currentVendors[currentCat] = currentVendor; }
    if(!(currentHik[currentCat] in hikStores[currentCat])){ currentHik[currentCat] = Object.keys(hikStores[currentCat])[0]; }
    HIK = hikStores[currentCat][currentHik[currentCat]];
    initCatTabs(); initToggles(); initReportToggles(); initVendors(); initHik(); initVariant(); initSector();
    applyLangToChrome();
    const bs=document.getElementById('bespokeBox'); if(bs) bs.value = bespoke;
    const sn=document.getElementById('schoolName'); if(sn && d.schoolName!=null) sn.value = d.schoolName;
    const dq=document.getElementById('deckQty'); if(dq) dq.value = (calcState && calcState.qa!=null) ? calcState.qa : (d.deckQty!=null?d.deckQty:'');
    render();
  } finally { suppressAutosave = false; }
}

  if(!box){
    box=document.createElement('div'); box.id='toastBox';
    box.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;max-width:520px;width:calc(100% - 32px);';
    document.body.appendChild(box);
  }
  box.innerHTML=`<div style="background:#2A1418;border:1px solid var(--red);color:#FFD9DD;border-radius:11px;padding:13px 16px;
    box-shadow:0 8px 28px rgba(0,0,0,.45);font-size:13px;display:flex;align-items:flex-start;gap:10px;animation:toastIn .25s ease-out">
    <span style="font-size:16px;line-height:1">⚠</span>
    <span style="flex:1">${msg}</span>
    <button onclick="document.getElementById('toastBox').innerHTML=''" style="background:none;border:none;color:#FFD9DD;cursor:pointer;font-size:15px;padding:0 2px;line-height:1">✕</button>
  </div>`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ if(box) box.innerHTML=''; }, 12000);
}
function autoSave(){
  if(suppressAutosave) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(serializeState()));
    setSaveStatus('Saved '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ setSaveStatus('Autosave failed — export a backup instead', true); }
}
function autoLoadOnBoot(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    restoreState(JSON.parse(raw));
    setSaveStatus('Restored from this browser · '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
    return true;
  }catch(e){ setSaveStatus('Could not restore autosave — starting fresh', true); return false; }
}

/* boot */
if(!autoLoadOnBoot()){
  initCatTabs();initToggles();initReportToggles();initVendors();initHik();initVariant();initSector();applyLangToChrome();render();
}
</script>
</body>
